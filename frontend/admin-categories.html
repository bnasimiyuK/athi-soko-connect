<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Service categories · Athi Soko Connect</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="icon" href="data:,">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Athi Soko <span>Access</span></a>
    <nav class="main-nav">
      <a href="index.html" data-nav="index.html">Discover</a>
      <a href="register.html" data-nav="register.html">Become a Provider</a>
      <a href="dashboard.html" data-nav="dashboard.html">My Bookings</a>
      <a href="notices.html" data-nav="notices.html">Estate Notice Board</a>
    </nav>
  </div>
</header>

<main class="container" style="padding: 40px 24px; max-width: 900px;">

  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
    <div>
      <h1 style="margin-bottom:6px;">Service categories</h1>
      <p style="color:var(--ink-70); margin:0;">
        Categories group vendors on the Discover page. Only super admins can add, rename, or remove them.
      </p>
    </div>
    <button id="btn-add-cat" class="btn-primary">+ Add category</button>
  </div>

  <div id="cat-list" style="margin-top:28px;">
    <div class="empty-state">Loading…</div>
  </div>
</main>

<!-- Add/Edit modal -->
<div id="cat-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center; padding:16px;">
  <div style="background:#fff; border-radius:10px; padding:24px; width:min(460px,100%); box-shadow:0 8px 32px rgba(0,0,0,0.15);">
    <h2 id="cat-modal-title" style="margin-top:0;">New category</h2>

    <label style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-size:0.85rem; font-weight:600;">Label</span>
      <input type="text" id="cat-label" maxlength="60" placeholder="e.g. Plumbing"
             style="padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:1rem;" />
    </label>

    <label style="display:flex; flex-direction:column; gap:6px; margin-top:14px;">
      <span style="font-size:0.85rem; font-weight:600;">
        Icon <span style="color:var(--ink-40); font-weight:400;">(emoji — optional)</span>
      </span>
      <input type="text" id="cat-icon" maxlength="4" placeholder="e.g. 🔧"
             style="padding:10px 12px; border:1px solid var(--line); border-radius:6px; font-size:1.15rem;" />
      <span style="font-size:0.72rem; color:var(--ink-40);">
        Copy-paste an emoji from <a href="https://emojipedia.org" target="_blank" rel="noopener" style="color:var(--ochre-dark);">emojipedia.org</a> or your phone keyboard.
      </span>
    </label>

    <div id="cat-error" style="color:var(--clay); font-size:0.88rem; margin-top:12px; display:none;"></div>

    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
      <button type="button" id="cat-cancel" class="btn btn--ghost">Cancel</button>
      <button type="button" id="cat-save" class="btn-primary">Save</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/announcements.js"></script>
<script src="js/admin-categories.js"></script>
</body>
</html>
